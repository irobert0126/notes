<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识图谱 · notes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--card); flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    header a { color: var(--accent); text-decoration: none; font-size: 14px; }
    .legend { display: flex; gap: 12px; font-size: 13px; color: var(--muted); align-items: center; }
    .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    header button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); cursor: pointer; margin-left: auto; }
    #stage { flex: 1; position: relative; min-height: 0; }
    svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
    svg.panning { cursor: grabbing; }
    .edge { stroke: var(--muted); stroke-opacity: 0.35; }
    .edge.contains { stroke-dasharray: 4 3; }
    .edge.custom { stroke: #d97706; stroke-opacity: 0.7; }
    .node { cursor: pointer; stroke: var(--card); stroke-width: 1.5; }
    .label { font-size: 12px; fill: var(--text); pointer-events: none; }
    .label.topic { font-size: 14px; font-weight: 700; }
    .dim { opacity: 0.12; }
    #info { position: absolute; top: 12px; right: 12px; width: 280px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    #info h2 { font-size: 15px; margin: 0 0 6px; }
    #info .kind { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    #info ul { margin: 6px 0 0; padding-left: 18px; }
    #info a { color: var(--accent); }
    #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>知识图谱</h1>
    <a href="app.html">← 返回笔记</a>
    <div class="legend">
      <span><span class="dot" style="background:#2563eb"></span>主题</span>
      <span><span class="dot" style="background:#16a34a"></span>笔记</span>
      <span><span class="dot" style="background:#d97706"></span>概念</span>
    </div>
    <button type="button" id="reset">重新布局</button>
  </header>
  <div id="stage">
    <svg id="canvas" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
      <g id="world">
        <g id="edges"></g>
        <g id="nodes"></g>
        <g id="labels"></g>
      </g>
    </svg>
    <div id="info" hidden></div>
    <div id="hint">拖动节点；拖动空白处平移；滚轮缩放；点击笔记节点打开。</div>
  </div>
  <script src="graph.js"></script>
</body>
</html>
