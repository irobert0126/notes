<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shell { display: flex; height: 100vh; margin: 0; overflow: hidden; }
    .shell #tree { width: 280px; flex: 0 0 280px; overflow-y: auto; padding: 16px 12px; box-sizing: border-box; background: var(--card); border-right: 1px solid var(--border); }
    .brand { font-weight: 700; font-size: 15px; padding: 4px 8px 12px; }
    .brand a { color: var(--text); text-decoration: none; margin-right: 6px; }
    #tree details { margin-bottom: 6px; }
    #tree summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); padding: 4px 8px; }
    #tree ul { list-style: none; margin: 0; padding: 0 0 0 10px; }
    #tree a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #tree a:hover { background: var(--bg); }
    #tree a.selected { background: var(--accent); color: #fff; }
    #search { width: 100%; box-sizing: border-box; margin: 0 0 12px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px; }

    #pane { flex: 1; min-width: 0; position: relative; }
    #note, #listing { position: absolute; inset: 0; overflow-y: auto; padding: 36px 52px 80px; box-sizing: border-box; }
    .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
    .toolbar button, .zoombar button { font: inherit; font-size: 14px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; }
    .toolbar button:hover, .zoombar button:hover { border-color: var(--accent); color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
    .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .md-body { max-width: 860px; line-height: 1.8; font-size: 15px; overflow-wrap: anywhere; }
    .md-body h1 { font-size: 28px; margin-top: 0; }
    .md-body h2 { font-size: 20px; margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .md-body h3 { font-size: 17px; margin-top: 1.5em; }
    .md-body pre { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; }
    .md-body code { font-family: Menlo, Consolas, monospace; font-size: 0.9em; }
    .md-body img { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; cursor: zoom-in; margin: 8px 0; }
    .md-body table { border-collapse: collapse; margin: 12px 0; }
    .md-body th, .md-body td { border: 1px solid var(--border); padding: 4px 8px; }
    .note-foot { max-width: 860px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; }
    .note-foot h3 { font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
    .note-foot ul { margin: 0; padding-left: 18px; }

    .results { list-style: none; margin: 0; padding: 0; }
    .results li { margin-bottom: 10px; }
    .results a { display: block; padding: 12px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; }
    .results a:hover { border-color: var(--accent); }
    .results .name { display: block; font-weight: 600; }
    .results .path { display: block; color: var(--muted); font-size: 12px; }
    .results .snip { display: block; margin-top: 6px; font-size: 13px; line-height: 1.6; }

    .grid-topics { display: grid; gap: 12px; list-style: none; padding: 0; }
    .grid-topics a { display: block; padding: 16px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); text-decoration: none; }
    .grid-topics a:hover { border-color: var(--accent); }

    dialog { inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #111; }
    .viewer { width: 100%; height: 100%; overflow: auto; }
    .viewer img { display: block; margin: 0 auto; max-width: none; height: auto; }
    .zoombar { position: fixed; top: 12px; right: 12px; z-index: 1; display: flex; align-items: center; gap: 6px; }
    .zoombar button { background: rgba(30, 30, 30, 0.85); color: #eee; border-color: #444; }
    .zoombar .level { min-width: 56px; text-align: center; color: #eee; font-size: 14px; }

    @media print {
      @page { margin: 12mm; }
      #tree, .toolbar, dialog, #listing { display: none !important; }
      .shell { display: block; height: auto; overflow: visible; }
      #pane { position: static; }
      #note { position: static; padding: 0; overflow: visible; }
      body { background: #fff; color: #000; }
      .md-body img { cursor: default; }
    }
    @media (max-width: 720px) {
      .shell { display: block; height: auto; overflow: visible; }
      .shell #tree { width: auto; flex: none; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
      #pane { height: 70vh; }
      #note, #listing { padding: 20px; }
    }
  </style>
</head>
<body class="shell">
  <aside id="tree">
    <div class="brand"><a href="app.html">notes</a><a href="graph.html">图谱</a></div>
    <input id="search" type="search" placeholder="搜索标题或内容" autocomplete="off">
    <div id="nav"></div>
  </aside>
  <section id="pane">
    <article id="note" hidden>
      <div class="toolbar"><button type="button" id="print-btn">打印</button></div>
      <div class="md-body" id="body"></div>
      <div id="chips" class="chips"></div>
      <section class="note-foot" id="foot"></section>
    </article>
    <div id="listing" hidden></div>
  </section>

  <dialog id="viewer">
    <div class="zoombar">
      <button type="button" id="zoom-out-btn" aria-label="缩小">−</button>
      <span class="level" id="level">100%</span>
      <button type="button" id="zoom-in-btn" aria-label="放大">+</button>
      <button type="button" id="zoom-fit-btn">适应</button>
      <button type="button" id="close-btn">关闭</button>
    </div>
    <div class="viewer" id="scroller">
      <img id="big" alt="">
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
