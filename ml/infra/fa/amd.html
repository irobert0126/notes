<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML / infra / fa / AMD</title>
  <link rel="stylesheet" href="../../../style.css">
  <style>
    .toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .toolbar button,
    .zoombar button {
      font: inherit;
      font-size: 14px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .toolbar button:hover,
    .zoombar button:hover { border-color: var(--accent); color: var(--accent); }

    .thumb {
      display: block;
      padding: 0;
      border: 0;
      background: none;
      cursor: zoom-in;
    }

    .thumb img {
      width: 340px;
      max-width: 100%;
      border: 1px solid var(--border);
    }

    dialog {
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: #111;
    }

    .viewer {
      width: 100%;
      height: 100%;
      overflow: auto;
    }

    .viewer img {
      display: block;
      margin: 0 auto;
      max-width: none;
      height: auto;
    }

    .zoombar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoombar button {
      background: rgba(30, 30, 30, 0.85);
      color: #eee;
      border-color: #444;
    }

    .zoombar .level {
      min-width: 56px;
      text-align: center;
      color: #eee;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    @media print {
      @page { margin: 12mm; }

      body { background: #fff; color: #000; }
      main { max-width: none; padding: 0; }
      .crumbs, .toolbar, .lead, dialog { display: none; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      .content { background: none; border: 0; box-shadow: none; padding: 0; }
      .thumb { cursor: default; }
      .thumb img { width: 100%; border: 0; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="crumbs"><a href="../../../index.html">notes</a> / <a href="../../index.html">ml</a> / <a href="../index.html">infra</a> / <a href="index.html">fa</a> / AMD</nav>
    <div class="toolbar">
      <button type="button" id="print-btn">打印</button>
    </div>
    <h1>AMD MI350X TLX Tiling：B / L / H / D 落在 kernel 的哪一层</h1>
    <p class="lead">Flash Attention 在 AMD MI350X (gfx950) 上的 tile 划分（点击图片放大）</p>
    <div class="content">
      <button type="button" class="thumb" id="open-btn" aria-label="放大查看图片">
        <img src="images/amd_tiling.png" alt="AMD MI350X TLX tiling 图">
      </button>
    </div>
  </main>
  <dialog id="viewer">
    <div class="zoombar">
      <button type="button" id="zoom-out-btn" aria-label="缩小">−</button>
      <span class="level" id="level">100%</span>
      <button type="button" id="zoom-in-btn" aria-label="放大">+</button>
      <button type="button" id="zoom-fit-btn">适应</button>
      <button type="button" id="close-btn">关闭</button>
    </div>
    <div class="viewer" id="scroller">
      <img id="big" src="images/amd_tiling.png" alt="AMD MI350X TLX tiling 图">
    </div>
  </dialog>
  <script>
    const dialog = document.getElementById('viewer');
    const scroller = document.getElementById('scroller');
    const big = document.getElementById('big');
    const level = document.getElementById('level');
    const MIN_SCALE = 0.1;
    const MAX_SCALE = 8;
    let scale = 1;

    function fitScale() {
      return Math.min(scroller.clientWidth / big.naturalWidth, scroller.clientHeight / big.naturalHeight);
    }

    function render() {
      big.style.width = big.naturalWidth * scale + 'px';
      level.textContent = Math.round(scale * 100) + '%';
    }

    function setScale(next) {
      scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
      render();
    }

    function openViewer() {
      dialog.showModal();
      setScale(fitScale());
    }

    document.getElementById('open-btn').addEventListener('click', openViewer);
    document.getElementById('close-btn').addEventListener('click', () => dialog.close());
    document.getElementById('zoom-in-btn').addEventListener('click', () => setScale(scale * 1.25));
    document.getElementById('zoom-out-btn').addEventListener('click', () => setScale(scale / 1.25));
    document.getElementById('zoom-fit-btn').addEventListener('click', () => setScale(fitScale()));
    document.getElementById('print-btn').addEventListener('click', () => window.print());

    scroller.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      setScale(scale * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
    }, { passive: false });

    dialog.addEventListener('keydown', (e) => {
      if (e.key === '+' || e.key === '=') setScale(scale * 1.25);
      else if (e.key === '-') setScale(scale / 1.25);
      else if (e.key === '0') setScale(fitScale());
    });
  </script>
</body>
</html>
